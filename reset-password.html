<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Kalyra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="icon" type="image/png" href="assets/imgs/favicon.png">
    <style>
        .rp-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f0ea;
            padding: 40px 16px;
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .rp-card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border: 1px solid #ece8e0;
            border-radius: 16px;
            padding: 40px 36px 32px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
        }
        .rp-brand {
            text-align: center;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--accent);
            font-size: 24px;
            margin-bottom: 4px;
        }
        .rp-sub {
            text-align: center;
            font-size: 11px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #aaa;
            margin-bottom: 28px;
        }
        .rp-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            color: #1a1a1a;
            margin: 0 0 6px;
            text-align: center;
        }
        .rp-desc {
            font-size: 14px;
            color: #777;
            text-align: center;
            margin: 0 0 26px;
            line-height: 1.6;
        }
        .rp-field { margin-bottom: 16px; }
        .rp-field label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
        }
        .rp-field input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #ddd6cc;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .rp-field input:focus { border-color: var(--accent); }
        .rp-btn {
            width: 100%;
            padding: 14px;
            background: #1a1a1a;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.04em;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }
        .rp-btn:hover { background: #000; }
        .rp-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .rp-msg {
            display: none;
            font-size: 13.5px;
            line-height: 1.5;
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 18px;
        }
        .rp-msg.error { display: block; background: #fce8e8; border-left: 3px solid #c0392b; color: #a02b22; }
        .rp-msg.success { display: block; background: #f0faf5; border-left: 3px solid #2e7d32; color: #2e7d32; }
        .rp-hint { font-size: 12px; color: #aaa; margin: 4px 0 0; }
        .rp-foot { text-align: center; margin-top: 22px; font-size: 13.5px; }
        .rp-foot a { color: var(--accent); text-decoration: none; font-weight: 500; }
        .rp-foot a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="rp-wrap">
        <div class="rp-card">
            <div class="rp-brand">KALYRA</div>
            <div class="rp-sub">Timeless Craft</div>

            <h1 class="rp-title">Reset your password</h1>
            <p class="rp-desc">Choose a new password for your Kalyra account.</p>

            <div id="rp-error" class="rp-msg error"></div>
            <div id="rp-success" class="rp-msg success"></div>

            <form id="rp-form">
                <div class="rp-field">
                    <label for="rp-pw">New password</label>
                    <input type="password" id="rp-pw" autocomplete="new-password" placeholder="••••••••" required>
                    <p class="rp-hint">At least 8 characters, one uppercase letter and one number.</p>
                </div>
                <div class="rp-field">
                    <label for="rp-confirm">Confirm new password</label>
                    <input type="password" id="rp-confirm" autocomplete="new-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="rp-btn" id="rp-submit">Reset Password</button>
            </form>

            <div class="rp-foot">
                <a href="index.html">← Back to home</a>
            </div>
        </div>
    </div>

    <script src="scripts/api.js"></script>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');

            const form    = document.getElementById('rp-form');
            const pwEl     = document.getElementById('rp-pw');
            const confEl   = document.getElementById('rp-confirm');
            const submit   = document.getElementById('rp-submit');
            const errEl    = document.getElementById('rp-error');
            const succEl   = document.getElementById('rp-success');

            function showError(msg) {
                errEl.textContent = msg;
                errEl.classList.add('error');
                errEl.style.display = 'block';
                succEl.style.display = 'none';
            }
            function showSuccess(msg) {
                succEl.textContent = msg;
                succEl.style.display = 'block';
                errEl.style.display = 'none';
            }

            // No token in the link → nothing we can do
            if (!token) {
                form.style.display = 'none';
                showError('This reset link is invalid or incomplete. Please request a new password reset from the login screen.');
                return;
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errEl.style.display = 'none';
                succEl.style.display = 'none';

                const pw   = pwEl.value;
                const conf = confEl.value;

                if (pw.length < 8)     return showError('Password must be at least 8 characters.');
                if (!/[A-Z]/.test(pw)) return showError('Password must contain at least one uppercase letter.');
                if (!/[0-9]/.test(pw)) return showError('Password must contain at least one number.');
                if (pw !== conf)       return showError('Passwords do not match.');

                submit.disabled = true;
                submit.textContent = 'Resetting…';
                try {
                    const res = await window.KalyraAPI.resetPassword(token, pw);
                    form.style.display = 'none';
                    showSuccess(res.message || 'Password reset successfully. You can now log in with your new password.');
                    setTimeout(() => { window.location.href = 'index.html'; }, 2500);
                } catch (err) {
                    showError(err.message || 'Could not reset your password. The link may have expired — please request a new one.');
                    submit.disabled = false;
                    submit.textContent = 'Reset Password';
                }
            });
        })();
    </script>
</body>
</html>
