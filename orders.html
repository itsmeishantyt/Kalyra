<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders — Kalyra</title>
    <meta name="description" content="View and manage your Kalyra orders.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="icon" type="image/png" href="assets/imgs/favicon.png">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        .account-page { min-height: 100vh; background: #faf8f4; padding-top: 100px; }
        .account-container { max-width: 860px; margin: 0 auto; padding: 40px 24px 80px; }
        .account-heading { font-family: var(--serif); font-size: 36px; font-weight: 400; color: #222; margin-bottom: 6px; }
        .account-heading em { font-style: italic; color: #B89B71; }
        .account-sub { font-size: 14px; color: #888; margin-bottom: 36px; font-family: var(--sans); }

        /* Filter tabs */
        .order-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
        .order-tab { padding: 7px 18px; border-radius: 40px; border: 1px solid #e0d9cf; background: #fff; font-size: 13px; font-family: var(--sans); cursor: pointer; transition: all .2s; color: #666; }
        .order-tab.active, .order-tab:hover { background: #B89B71; color: #fff; border-color: #B89B71; }

        /* Order card */
        .order-card { background: #fff; border: 1px solid #ece8e0; border-radius: 16px; margin-bottom: 16px; overflow: hidden; transition: box-shadow .2s; }
        .order-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.07); }
        .order-card-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid #f3f0ea; flex-wrap: wrap; gap: 10px; }
        .order-ref { font-size: 13px; font-weight: 600; color: #B89B71; letter-spacing: .04em; font-family: var(--sans); }
        .order-date { font-size: 12px; color: #999; font-family: var(--sans); margin-top: 2px; }
        .order-status { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 40px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-family: var(--sans); }
        .status-pending         { background: #fff8e6; color: #c87f00; }
        .status-confirmed       { background: #e6f4ff; color: #0070c0; }
        .status-processing      { background: #e6f0ff; color: #4040c0; }
        .status-shipped         { background: #f0e6ff; color: #7030a0; }
        .status-delivered       { background: #e6f9f0; color: #006633; }
        .status-cancelled       { background: #fce8e8; color: #c00; }
        .status-refunded        { background: #f5f5f5; color: #666; }
        .order-card-body { padding: 18px 22px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
        .order-items-count { font-size: 13px; color: #666; font-family: var(--sans); }
        .order-total { font-size: 17px; font-weight: 600; color: #222; font-family: var(--sans); }
        .order-actions { display: flex; gap: 10px; }
        .btn-order-detail { padding: 8px 18px; border-radius: 40px; background: #B89B71; color: #fff; border: none; font-size: 13px; cursor: pointer; font-family: var(--sans); transition: background .2s; }
        .btn-order-detail:hover { background: #9a7e57; }
        .btn-cancel-order { padding: 8px 18px; border-radius: 40px; background: #fff; color: #c0392b; border: 1px solid #f5c6c3; font-size: 13px; cursor: pointer; font-family: var(--sans); transition: all .2s; }
        .btn-cancel-order:hover { background: #fce8e8; }

        /* Empty state */
        .orders-empty { text-align: center; padding: 80px 24px; }
        .orders-empty-icon { font-size: 56px; margin-bottom: 20px; }
        .orders-empty h3 { font-family: var(--serif); font-size: 26px; color: #333; margin-bottom: 10px; }
        .orders-empty p { font-size: 14px; color: #888; font-family: var(--sans); margin-bottom: 28px; }
        .btn-shop-now { display: inline-block; padding: 13px 32px; background: #B89B71; color: #fff; border-radius: 40px; text-decoration: none; font-family: var(--sans); font-size: 14px; font-weight: 500; transition: background .2s; }
        .btn-shop-now:hover { background: #9a7e57; }

        /* Loading */
        .orders-loading { text-align: center; padding: 60px 0; color: #aaa; font-family: var(--sans); font-size: 14px; }

        /* Order detail drawer */
        .order-detail-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.35); backdrop-filter: blur(6px); z-index: 8000; display: none; }
        .order-detail-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100vw); background: #fff; z-index: 8001; overflow-y: auto; transform: translateX(100%); transition: transform .4s cubic-bezier(.165,.84,.44,1); padding: 32px 28px; }
        .order-detail-drawer.open { transform: translateX(0); }
        .drawer-close-btn { position: absolute; top: 20px; right: 20px; background: #f3f0ea; border: none; border-radius: 50%; width: 34px; height: 34px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        .drawer-close-btn:hover { background: #B89B71; color: #fff; }
        .drawer-order-ref { font-size: 12px; color: #B89B71; font-weight: 600; letter-spacing: .06em; margin-bottom: 8px; font-family: var(--sans); }
        .drawer-order-title { font-family: var(--serif); font-size: 24px; color: #222; margin-bottom: 24px; }
        .drawer-section-title { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #999; margin: 22px 0 12px; font-family: var(--sans); }
        .drawer-item-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid #f3f0ea; font-family: var(--sans); }
        .drawer-item-name { font-size: 14px; color: #333; }
        .drawer-item-meta { font-size: 12px; color: #999; margin-top: 2px; }
        .drawer-item-price { font-size: 14px; font-weight: 600; color: #222; }
        .drawer-total-row { display: flex; justify-content: space-between; padding: 8px 0; font-family: var(--sans); font-size: 13px; color: #666; }
        .drawer-total-row.grand { font-size: 16px; font-weight: 600; color: #222; border-top: 1px solid #e0d9cf; margin-top: 8px; padding-top: 14px; }
        .drawer-address-block { background: #faf8f4; border-radius: 10px; padding: 14px; font-family: var(--sans); font-size: 13px; color: #555; line-height: 1.7; }

        /* Pagination */
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 32px; }
        .page-btn { padding: 8px 16px; border-radius: 40px; border: 1px solid #e0d9cf; background: #fff; font-size: 13px; cursor: pointer; font-family: var(--sans); transition: all .2s; }
        .page-btn.active, .page-btn:hover { background: #B89B71; color: #fff; border-color: #B89B71; }
        .page-btn:disabled { opacity: .4; cursor: default; }

        /* Auth guard */
        .auth-guard { text-align: center; padding: 80px 24px; }
        .auth-guard h3 { font-family: var(--serif); font-size: 28px; color: #333; margin-bottom: 12px; }
        .auth-guard p { font-size: 14px; color: #888; font-family: var(--sans); margin-bottom: 28px; }
        .btn-login-now { display: inline-block; padding: 13px 32px; background: #B89B71; color: #fff; border-radius: 40px; text-decoration: none; font-family: var(--sans); font-size: 14px; font-weight: 500; cursor: pointer; border: none; }
    </style>
</head>
<body>
<nav id="navbar"></nav>

<div class="account-page">
    <div class="account-container">
        <h1 class="account-heading">My <em>Orders</em></h1>
        <p class="account-sub">Track, manage, and review your purchases</p>

        <div id="orders-root">
            <div class="orders-loading">Loading your orders…</div>
        </div>
    </div>
</div>

<footer id="footer"></footer>

<!-- Order detail drawer -->
<div class="order-detail-backdrop" id="order-detail-backdrop"></div>
<div class="order-detail-drawer" id="order-detail-drawer">
    <button class="drawer-close-btn" id="drawer-close-btn" aria-label="Close">×</button>
    <div class="drawer-order-ref" id="drawer-order-ref"></div>
    <div class="drawer-order-title">Order Details</div>
    <div id="drawer-content"></div>
</div>

<script src="scripts/api.js"></script>
<script src="scripts/auth.js"></script>
<script src="scripts/cart.js"></script>
<script src="scripts/main.js"></script>
<script>
const STATUS_LABELS = {
    pending: 'Pending', confirmed: 'Confirmed', processing: 'Processing',
    shipped: 'Shipped', delivered: 'Delivered', cancelled: 'Cancelled', refunded: 'Refunded'
};

let currentPage = 1;
let currentStatus = '';

async function loadOrders(page = 1, status = '') {
    const root = document.getElementById('orders-root');
    root.innerHTML = '<div class="orders-loading">Loading your orders…</div>';
    try {
        const params = { page, limit: 8 };
        if (status) params.status = status;
        const qs = new URLSearchParams(params).toString();
        const res = await window.KalyraAPI?.getOrders ? window.KalyraAPI.getOrders(params) :
            fetch(`http://localhost:3000/api/v1/orders?${qs}`, {
                headers: { Authorization: `Bearer ${window.KalyraToken?.getAccess()}` }
            }).then(r => r.json());

        const { data: orders, meta } = res;
        renderOrders(orders, meta, page, status);
    } catch (err) {
        root.innerHTML = `<div class="orders-empty"><div class="orders-empty-icon">⚠️</div><h3>Could not load orders</h3><p>${err.message}</p></div>`;
    }
}

function renderOrders(orders, meta, page, status) {
    const root = document.getElementById('orders-root');
    const tabs = ['', 'pending', 'confirmed', 'processing', 'shipped', 'delivered', 'cancelled']
        .map(s => `<button class="order-tab ${status === s ? 'active' : ''}" data-status="${s}">${s ? STATUS_LABELS[s] : 'All'}</button>`).join('');

    if (!orders || orders.length === 0) {
        root.innerHTML = `
            <div class="order-tabs">${tabs}</div>
            <div class="orders-empty">
                <div class="orders-empty-icon">📦</div>
                <h3>No orders yet</h3>
                <p>When you place an order, it will appear here.</p>
                <a href="shop.html" class="btn-shop-now">Start Shopping →</a>
            </div>`;
    } else {
        const cards = orders.map(o => `
            <div class="order-card">
                <div class="order-card-header">
                    <div>
                        <div class="order-ref">${o.order_ref}</div>
                        <div class="order-date">${new Date(o.created_at).toLocaleDateString('en-IN', { day:'numeric', month:'long', year:'numeric' })}</div>
                    </div>
                    <span class="order-status status-${o.status}">${STATUS_LABELS[o.status] || o.status}</span>
                </div>
                <div class="order-card-body">
                    <div class="order-items-count">${o.item_count} item${o.item_count !== 1 ? 's' : ''}</div>
                    <div class="order-total">₹${Number(o.total_amount).toLocaleString('en-IN')}</div>
                    <div class="order-actions">
                        <button class="btn-order-detail" onclick="openOrderDetail(${o.id}, '${o.order_ref}')">View Details</button>
                        ${['pending','confirmed'].includes(o.status) ? `<button class="btn-cancel-order" onclick="cancelOrder(${o.id})">Cancel</button>` : ''}
                    </div>
                </div>
            </div>`).join('');

        const totalPages = Math.ceil(meta.total / meta.limit);
        const pagination = totalPages > 1 ? `
            <div class="pagination">
                <button class="page-btn" onclick="loadOrders(${page-1},'${status}')" ${page<=1?'disabled':''}>← Prev</button>
                <button class="page-btn active">${page} / ${totalPages}</button>
                <button class="page-btn" onclick="loadOrders(${page+1},'${status}')" ${page>=totalPages?'disabled':''}>Next →</button>
            </div>` : '';

        root.innerHTML = `<div class="order-tabs">${tabs}</div>${cards}${pagination}`;
    }

    // Wire tab clicks
    root.querySelectorAll('.order-tab').forEach(btn => {
        btn.addEventListener('click', () => {
            currentStatus = btn.dataset.status;
            currentPage = 1;
            loadOrders(1, currentStatus);
        });
    });
}

async function openOrderDetail(orderId, ref) {
    const drawer = document.getElementById('order-detail-drawer');
    const backdrop = document.getElementById('order-detail-backdrop');
    const content = document.getElementById('drawer-content');
    document.getElementById('drawer-order-ref').textContent = ref;
    content.innerHTML = '<div class="orders-loading">Loading…</div>';
    drawer.classList.add('open');
    backdrop.style.display = 'block';
    document.body.style.overflow = 'hidden';

    try {
        const res = await fetch(`http://localhost:3000/api/v1/orders/${orderId}`, {
            headers: { Authorization: `Bearer ${window.KalyraToken?.getAccess()}` }
        }).then(r => r.json());
        const { order, items, payments } = res.data;

        const itemRows = items.map(i => `
            <div class="drawer-item-row">
                <div>
                    <div class="drawer-item-name">${i.product_name}</div>
                    <div class="drawer-item-meta">Qty: ${i.quantity}${i.size ? ' · ' + i.size : ''}${i.color ? ' · ' + i.color : ''}</div>
                </div>
                <div class="drawer-item-price">₹${Number(i.subtotal).toLocaleString('en-IN')}</div>
            </div>`).join('');

        const addressLine = [order.line1, order.line2, order.city, order.state, order.postal_code, order.country].filter(Boolean).join(', ');

        content.innerHTML = `
            <div class="drawer-section-title">Items</div>
            ${itemRows}
            <div class="drawer-section-title">Bill Summary</div>
            <div class="drawer-total-row"><span>Subtotal</span><span>₹${Number(order.subtotal).toLocaleString('en-IN')}</span></div>
            ${order.discount_amount > 0 ? `<div class="drawer-total-row"><span>Discount${order.promo_code ? ' (' + order.promo_code + ')' : ''}</span><span style="color:#2d6a4f">−₹${Number(order.discount_amount).toLocaleString('en-IN')}</span></div>` : ''}
            <div class="drawer-total-row"><span>GST (5%)</span><span>₹${Number(order.tax_amount).toLocaleString('en-IN')}</span></div>
            <div class="drawer-total-row grand"><span>Total Paid</span><span>₹${Number(order.total_amount).toLocaleString('en-IN')}</span></div>
            ${addressLine ? `<div class="drawer-section-title">Delivery Address</div><div class="drawer-address-block">${addressLine}</div>` : ''}`;
    } catch (e) {
        content.innerHTML = `<p style="color:#c0392b;font-family:var(--sans);font-size:14px;">Could not load order details.</p>`;
    }
}

function closeDrawer() {
    document.getElementById('order-detail-drawer').classList.remove('open');
    document.getElementById('order-detail-backdrop').style.display = 'none';
    document.body.style.overflow = '';
}

async function cancelOrder(orderId) {
    if (!confirm('Cancel this order? This cannot be undone.')) return;
    try {
        const res = await fetch(`http://localhost:3000/api/v1/orders/${orderId}/cancel`, {
            method: 'PATCH',
            headers: { Authorization: `Bearer ${window.KalyraToken?.getAccess()}` }
        }).then(r => r.json());
        window.showToast?.('Order cancelled successfully.', 'success');
        loadOrders(currentPage, currentStatus);
    } catch (e) {
        window.showToast?.('Could not cancel order.', 'error');
    }
}

document.getElementById('drawer-close-btn').addEventListener('click', closeDrawer);
document.getElementById('order-detail-backdrop').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

// Auth guard
window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
        if (!window.KalyraToken?.isLoggedIn()) {
            document.getElementById('orders-root').innerHTML = `
                <div class="auth-guard">
                    <h3>Sign in to view your orders</h3>
                    <p>You need to be logged in to see your order history.</p>
                    <button class="btn-login-now" onclick="document.querySelector('a[href=\\'#login\\']')?.click()">Sign In</button>
                </div>`;
        } else {
            loadOrders();
        }
    }, 400);
});
</script>
</body>
</html>
