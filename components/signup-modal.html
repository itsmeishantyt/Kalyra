<div class="signup-backdrop" id="signup-backdrop"></div>

<div class="login-modal signup-modal-wide" id="signup-modal" role="dialog" aria-modal="true" aria-label="Create Account">
    <button class="login-close" id="signup-close" aria-label="Close">&times;</button>

    <!-- Header -->
    <div class="signup-header">
        <h2 class="login-title">Join <em>Kalyra</em></h2>
        <p class="login-sub">Create your account and start collecting</p>
    </div>

    <!-- Progress steps -->
    <div class="signup-steps-indicator" id="signup-step-indicator" aria-hidden="true">
        <div class="step-dot active" data-step="1"></div>
        <div class="step-line"></div>
        <div class="step-dot" data-step="2"></div>
        <div class="step-line"></div>
        <div class="step-dot" data-step="3"></div>
    </div>

    <!-- ── STEP 1: Name + Email ── -->
    <div id="signup-step-1" class="signup-step active">
        <div class="signup-step-label">Step 1 of 3 — Your details</div>

        <div class="login-field">
            <label class="login-label" for="signup-name">FULL NAME</label>
            <input type="text" id="signup-name" class="login-input" placeholder="e.g., Priya Sharma"
                   autocomplete="name" maxlength="100">
            <span class="field-error" id="err-name"></span>
        </div>

        <div class="login-field" style="margin-top:14px;">
            <label class="login-label" for="signup-email">EMAIL ADDRESS</label>
            <input type="email" id="signup-email" class="login-input" placeholder="you@example.com"
                   autocomplete="email">
            <span class="field-error" id="err-email"></span>
        </div>

        <div class="login-field" style="margin-top:14px;">
            <label class="login-label" for="signup-phone">PHONE NUMBER <span class="field-optional">(optional)</span></label>
            <div class="phone-input-group">
                <div class="country-select">
                    <img src="https://flagcdn.com/w20/in.png" alt="IN" class="flag-icon">
                    <span>+91</span>
                </div>
                <input type="tel" id="signup-phone" class="login-input" placeholder="10-digit number" maxlength="10">
            </div>
            <span class="field-error" id="err-phone"></span>
        </div>

        <button type="button" class="login-submit" id="signup-next-1" style="margin-top:22px;">
            Continue →
        </button>

        <div style="text-align:center;margin-top:16px;padding-top:16px;border-top:1px solid #f3f0ea;">
            <span style="font-size:13px;color:#888;">Already have an account? </span>
            <a href="#login" class="signup-switch-to-login" style="font-size:13px;color:var(--stitch-gold,#B89B71);font-weight:500;text-decoration:none;">Sign in</a>
        </div>
    </div>

    <!-- ── STEP 2: Password ── -->
    <div id="signup-step-2" class="signup-step" hidden>
        <div class="signup-step-label">Step 2 of 3 — Secure your account</div>

        <div class="login-field">
            <label class="login-label" for="signup-password">CREATE PASSWORD</label>
            <div style="position:relative;">
                <input type="password" id="signup-password" class="login-input" placeholder="Min. 8 characters"
                       autocomplete="new-password" style="padding-right:44px;">
                <button type="button" class="pw-toggle-btn" data-target="signup-password" aria-label="Toggle password">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <span class="field-error" id="err-password"></span>

            <!-- Password strength bar -->
            <div class="pw-strength-wrap" id="pw-strength-wrap" style="margin-top:10px;display:none;">
                <div class="pw-strength-bar">
                    <div class="pw-strength-fill" id="pw-strength-fill"></div>
                </div>
                <span class="pw-strength-label" id="pw-strength-label"></span>
            </div>

            <!-- Password requirements checklist -->
            <ul class="pw-requirements" id="pw-requirements">
                <li class="req-item" id="req-len">
                    <span class="req-icon">○</span> At least 8 characters
                </li>
                <li class="req-item" id="req-upper">
                    <span class="req-icon">○</span> One uppercase letter (A–Z)
                </li>
                <li class="req-item" id="req-num">
                    <span class="req-icon">○</span> One number (0–9)
                </li>
            </ul>
        </div>

        <div class="login-field" style="margin-top:18px;">
            <label class="login-label" for="signup-confirm">CONFIRM PASSWORD</label>
            <div style="position:relative;">
                <input type="password" id="signup-confirm" class="login-input" placeholder="Re-enter password"
                       autocomplete="new-password" style="padding-right:44px;">
                <button type="button" class="pw-toggle-btn" data-target="signup-confirm" aria-label="Toggle confirm">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <span class="field-error" id="err-confirm"></span>
        </div>

        <div style="display:flex;gap:10px;margin-top:22px;align-items:center;">
            <button type="button" class="login-back-btn" id="signup-back-1" style="flex:0 0 auto;width:auto;display:inline-flex;margin-top:0;padding:0 18px;text-decoration:underline;">← Back</button>
            <button type="button" class="login-submit" id="signup-next-2" style="flex:1;margin-top:0;">Continue →</button>
        </div>
    </div>

    <!-- ── STEP 3: Consent + Submit ── -->
    <div id="signup-step-3" class="signup-step" hidden>
        <div class="signup-step-label">Step 3 of 3 — Almost there!</div>

        <!-- Summary card -->
        <div class="signup-summary-card" id="signup-summary-card">
            <div class="summary-avatar" id="summary-avatar"></div>
            <div class="summary-info">
                <div class="summary-name" id="summary-name"></div>
                <div class="summary-email" id="summary-email"></div>
            </div>
        </div>

        <!-- Terms -->
        <div class="signup-terms-block">
            <label class="login-remember" id="terms-label">
                <input type="checkbox" id="signup-terms">
                <span class="login-check-box"></span>
                <span class="login-check-label">
                    I agree to Kalyra's <a href="terms.html" target="_blank">Terms &amp; Conditions</a>
                    and <a href="privacy.html" target="_blank">Privacy Policy</a>
                </span>
            </label>
            <span class="field-error" id="err-terms"></span>
        </div>

        <div class="signup-terms-block" style="margin-top:10px;">
            <label class="login-remember">
                <input type="checkbox" id="signup-marketing" checked>
                <span class="login-check-box"></span>
                <span class="login-check-label" style="color:#888;">Send me exclusive offers and new arrivals</span>
            </label>
        </div>

        <!-- Also offer Google signup as alternative -->
        <div class="signup-divider">
            <span>or sign up faster with</span>
        </div>
        <button type="button" id="signup-google-btn" class="signup-google-btn">
            <svg width="18" height="18" viewBox="0 0 24 24">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Continue with Google
        </button>

        <div style="display:flex;gap:10px;margin-top:20px;align-items:center;">
            <button type="button" class="login-back-btn" id="signup-back-2" style="flex:0 0 auto;width:auto;display:inline-flex;margin-top:0;text-decoration:underline;">← Back</button>
            <button type="button" class="login-submit" id="signup-submit-btn" style="flex:1;margin-top:0;">
                Create Account
            </button>
        </div>

        <!-- API error display -->
        <div class="signup-api-error" id="signup-api-error" style="display:none;"></div>
    </div>

</div>

<style>
/* ── Signup modal specific styles ─────────────────────── */
.signup-modal-wide {
    max-width: 420px;
}

/* Override global login-back-btn (display:block;width:100%) when inside flex row */
.signup-modal-wide div[style*="display:flex"] > .login-back-btn {
    display: inline-flex !important;
    width: auto !important;
    margin-top: 0 !important;
    align-items: center;
}

/* Ensure login-submit inside flex also drops its own margin-top */
.signup-modal-wide div[style*="display:flex"] > .login-submit {
    margin-top: 0 !important;
}

.signup-header {
    text-align: center;
    margin-bottom: 20px;
}

/* Progress indicator */
.signup-steps-indicator {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    margin-bottom: 22px;
}
.step-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #e0d9cf;
    transition: background .3s, transform .3s;
    flex-shrink: 0;
}
.step-dot.active {
    background: var(--stitch-gold, #B89B71);
    transform: scale(1.3);
}
.step-dot.done {
    background: #2d6a4f;
}
.step-line {
    flex: 1;
    max-width: 48px;
    height: 2px;
    background: #e0d9cf;
    margin: 0 4px;
    transition: background .3s;
}
.step-line.done {
    background: #2d6a4f;
}

/* Step label */
.signup-step-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--stitch-gold, #B89B71);
    margin-bottom: 18px;
}

/* Field errors */
.field-error {
    display: block;
    font-size: 12px;
    color: #c0392b;
    margin-top: 5px;
    min-height: 16px;
    transition: opacity .2s;
}
.field-optional {
    font-size: 11px;
    color: #aaa;
    font-weight: 400;
    font-style: italic;
    letter-spacing: 0;
    text-transform: none;
}

/* Password strength */
.pw-strength-bar {
    height: 4px;
    background: #f0ece4;
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 4px;
}
.pw-strength-fill {
    height: 100%;
    border-radius: 3px;
    transition: width .3s, background .3s;
    width: 0;
}
.pw-strength-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .04em;
}

/* Requirements list */
.pw-requirements {
    list-style: none;
    padding: 0;
    margin: 10px 0 0;
    display: flex;
    flex-direction: column;
    gap: 5px;
}
.req-item {
    font-size: 12px;
    color: #aaa;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: color .2s;
}
.req-item.met {
    color: #2d6a4f;
}
.req-item.met .req-icon::before { content: '✓'; }
.req-item:not(.met) .req-icon::before { content: '○'; }
.req-icon { font-size: 11px; }

/* Password toggle button */
.pw-toggle-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: #aaa;
    padding: 0;
    display: flex;
    align-items: center;
    transition: color .2s;
}
.pw-toggle-btn:hover { color: #555; }

/* Summary card */
.signup-summary-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: #fdf8f2;
    border: 1px solid #ece8e0;
    border-radius: 12px;
    margin-bottom: 20px;
}
.summary-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--stitch-gold, #B89B71);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: 600;
    font-family: var(--sans, sans-serif);
    flex-shrink: 0;
}
.summary-name {
    font-size: 15px;
    font-weight: 600;
    color: #222;
}
.summary-email {
    font-size: 12px;
    color: #888;
    margin-top: 2px;
    word-break: break-all;
}

/* Terms */
.signup-terms-block {
    margin-bottom: 4px;
}
.signup-terms-block a {
    color: var(--stitch-gold, #B89B71);
    text-decoration: underline;
}

/* Divider */
.signup-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 18px 0 12px;
    color: #bbb;
    font-size: 12px;
}
.signup-divider::before,
.signup-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #ece8e0;
}

/* Google signup button */
.signup-google-btn {
    width: 100%;
    height: 46px;
    background: #fff;
    border: 1px solid #dadce0;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 500;
    font-family: var(--sans, sans-serif);
    cursor: pointer;
    transition: box-shadow .2s, border-color .2s;
    color: #444;
}
.signup-google-btn:hover {
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
    border-color: #bbb;
}

/* API error */
.signup-api-error {
    background: #fdf0ef;
    border: 1px solid #f5c6c3;
    color: #c0392b;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    margin-top: 14px;
    line-height: 1.5;
}
</style>
